name: SORI compiler, backends and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional test dependencies (ASGI server, YAML parser)
        run: python -m pip install 'uvicorn>=0.34,<1' 'pyyaml>=6,<7'
      - name: Build Rust backend slice (runtime-rs, std-only)
        run: cargo build --release --locked --manifest-path runtime-rs/Cargo.toml
      - name: Run all tests (B1 legacy + unified core + security regression + backend parity)
        env:
          SORI_RT_BIN: runtime-rs/target/release/sori-rt
        run: python -m unittest discover -s tests -v
      - name: B1 compatibility — validate v0.1 example and artifacts
        run: |
          python -m sori check examples/hello.sori
          python -m sori build examples/hello.sori --out .sori-build-legacy
          for f in typed-ir openapi manifest; do python -m json.tool .sori-build-legacy/$f.json > /dev/null; done
      - name: Unified core — check, test and spec-build examples
        env:
          ADMIN_KEY: ci-admin-key
        run: |
          for ex in todo robot secure-api; do
            python -m sori check examples/$ex
            python -m sori test examples/$ex
            python -m sori build examples/$ex --target spec --out .sori-build/$ex
            for f in typed-ir openapi manifest tools; do python -m json.tool .sori-build/$ex/$f.json > /dev/null; done
          done
      - name: Migration smoke test (v0.1 → v0.3)
        run: |
          python -m sori migrate examples/hello.sori --out /tmp/hello-v03
          python -m sori check /tmp/hello-v03
      - name: Guard — no dynamic code execution in runtime paths (precise AST check is in tests)
        run: |
          if grep -rnE '(^|[^.A-Za-z_])(eval|exec|compile)\(' sori/ --include=*.py | grep -vE ':[0-9]+:\s*def (eval|exec|compile)\('; then
            echo "dynamic execution call found"; exit 1
          fi
      - name: Check Python compilation
        run: python -m compileall -q sori tests edge

  oci-image:
    # 생성된 OCI 빌드 컨텍스트로 실제 이미지를 빌드하고, 운영과 같은 제약(읽기전용 루트FS, cap drop ALL,
    # no-new-privileges, 비루트)으로 띄워서 응답을 확인한다.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uvicorn (pinned into the image requirements)
        run: python -m pip install 'uvicorn>=0.34,<1'
      - name: Generate OCI build contexts
        run: |
          python -m sori build examples/todo --target oci --out /tmp/oci-todo
          python -m sori build examples/secure-api --target oci --out /tmp/oci-secure
      - name: docker build
        run: |
          docker build -t sori-todo:ci /tmp/oci-todo
          docker build -t sori-secure:ci /tmp/oci-secure
          test "$(docker inspect -f '{{.Config.User}}' sori-todo:ci)" = "10001:10001"
      - name: Run hardened containers and probe
        run: |
          set -euo pipefail
          HARDEN="--read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges"
          docker run -d --name todo $HARDEN --tmpfs /app/data:rw,uid=10001,gid=10001 -p 127.0.0.1:18080:8080 sori-todo:ci
          TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          docker run -d --name secure $HARDEN -e SORI_API_TOKEN="$TOKEN" -p 127.0.0.1:18000:8000 sori-secure:ci
          for port in 18080 18000; do
            for i in $(seq 1 40); do curl -fsS "http://127.0.0.1:$port/healthz" && break; sleep 0.5; done
          done
          curl -fsS http://127.0.0.1:18080/api/todos | python -m json.tool
          curl -fsS http://127.0.0.1:18080/static/app.css > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/metrics)" = "404"
          curl -fsS http://127.0.0.1:18000/health | python -m json.tool
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"name":"ci"}' http://127.0.0.1:18000/greet)" = "401"
          curl -fsS -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" \
            -d '{"name":"ci"}' http://127.0.0.1:18000/greet | grep -q '안녕하세요, ci'
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs todo || true
          docker logs secure || true
